<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cardly</title>
<link rel="icon" href="assets/cardly-logo.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/cardly-logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#070f1f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="top">
  <a href="#/" aria-label="Cardly home"><img src="assets/cardly-logo.png" alt="Cardly logo" class="logo" /></a>
  <div class="search"><input id="search" type="search" placeholder="Search every deck…  press /" autocomplete="off" aria-label="Search decks" /></div>
  <button id="theme-btn" class="btn" aria-label="Change theme">Theme</button>
  <div id="theme-pop" class="pop"></div>
</header>
<p class="credit">Flashcard sets by CHS Grad and UC Berkeley CS Major Cardin Ia · <a href="https://quizlet.com/user/Cardin_5/folders" target="_blank" rel="noopener">My Quizlet Profile</a></p>

<main class="container">
  <section id="view-home"></section>
  <section id="view-subject" hidden></section>
  <details id="ios" class="ios">
    <summary>Add Cardly to your Home Screen on iOS</summary>
    <p class="muted">Safari → Share → Add to Home Screen</p>
    <img src="assets/ios1.png" alt="How to add Cardly to Home Screen on iOS" loading="lazy">
  </details>
</main>

<footer class="foot"><a href="#/">← Back to Home</a></footer>

<div id="quizlet-modal" class="modal">
  <div class="mc">
    <div class="mh">
      <span id="modal-title">Flashcards</span>
      <span class="mb">
        <button class="btn" id="prev" aria-label="Previous deck">‹</button>
        <button class="btn" id="next" aria-label="Next deck">›</button>
        <button class="btn pri" id="mark">Mark studied</button>
        <button class="btn" id="close-modal" aria-label="Close">×</button>
      </span>
    </div>
    <iframe id="quizlet-frame" src="" allowfullscreen loading="lazy"></iframe>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script src="gemini-chat.js"></script>
</body>
</html>
